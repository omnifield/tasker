apiVersion: omnifield.dev/v1
name: tasker
type: fullstack
title: Tasker
description: Дерево разработки — durable источник правды дизайна продуктов (рекурсивный узел + роллап)
reach:
  routes:
    # Фронт (vite+solid, read-first дерево) — listening-порт 5173. base "/tasker/" пресет берёт
    # из ЭТОГО же маршрута (@omnifield/vite-preset, единый источник — не хардкодим в vite.config).
    - path: /tasker
      port: 5173
    # Backend (Go) — контрактный порт registry/ports.md (нативный префикс /tasker/;
    # rewrite /api/tasker → tasker:8030/tasker/ — зона hub-core, как chater).
    - path: /api/tasker
      port: 8030
