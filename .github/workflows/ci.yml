name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Reusable не расширяет права сам — явный permissions обнуляет неперечисленное
# (объём — по канону каждого reusable: go → contents:read; node → +actions,+packages).
permissions: { contents: read, packages: read }
jobs:
  go:
    uses: omnifield/devopser/.github/workflows/go-ci.yml@main
  # web-job включим, когда приземлится фронт (web/, vite:5173). Сейчас MVP-граница —
  # только бэк-фундамент (брифом фронт «отложить»), каталога web/ ещё нет → reusable
  # web-ci упал бы на пустоте. Возвращаем вместе с первым фронт-скелетом.
  # web:
  #   uses: omnifield/devopser/.github/workflows/web-ci.yml@main
  #   with:
  #     working-directory: web
